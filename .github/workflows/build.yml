name: Build từ file zip

# Tải nguyên file .zip (project iOS) vào thư mục gốc hoặc thư mục inbox/ của repo.
# GitHub tự giải nén, tạo project (XcodeGen nếu có project.yml), build và xuất IPA chưa ký.
on:
  push:
    paths:
      - 'inbox/*.zip'
      - '*.zip'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Giải nén zip
        run: |
          set -e
          ZIP=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD 2>/dev/null | grep -E '^(inbox/)?[^/]+\.zip$' | head -1 || true)
          if [ -z "$ZIP" ]; then
            ZIP=$(ls -t inbox/*.zip *.zip 2>/dev/null | head -1 || true)
          fi
          if [ -z "$ZIP" ]; then
            echo "Không thấy file .zip nào ở thư mục gốc hoặc inbox/"
            exit 1
          fi
          echo "Dùng file: $ZIP"
          rm -rf _src && mkdir _src
          unzip -q "$ZIP" -x '__MACOSX/*' '*.DS_Store' -d _src
          # Nếu zip chỉ có đúng một thư mục gốc thì đi vào trong
          SRC=_src
          while [ "$(ls -A "$SRC" | wc -l | tr -d ' ')" = "1" ] && [ -d "$SRC/$(ls -A "$SRC")" ]; do
            SRC="$SRC/$(ls -A "$SRC")"
          done
          echo "Thư mục project: $SRC"
          echo "SRC=$SRC" >> "$GITHUB_ENV"

      - name: Cài XcodeGen
        run: brew install xcodegen

      - name: Build (không ký)
        run: |
          set -eo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          cd "$SRC"
          if [ -f project.yml ]; then xcodegen generate; fi
          PROJ=$(ls -d *.xcodeproj 2>/dev/null | head -1 || true)
          if [ -z "$PROJ" ]; then
            echo "Không thấy .xcodeproj hoặc project.yml trong zip"
            exit 1
          fi
          SCHEME=$(xcodebuild -list -project "$PROJ" -json | python3 -c "import sys,json; print(json.load(sys.stdin)['project']['schemes'][0])")
          echo "Scheme: $SCHEME"
          xcodebuild \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$GITHUB_WORKSPACE/out/build.log"
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr "$GITHUB_WORKSPACE/out/$SCHEME.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: out/*.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: out/build.log
